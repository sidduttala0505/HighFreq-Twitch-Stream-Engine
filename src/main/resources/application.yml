spring:
  main:
    web-application-type: none
    # nothing else holds the JVM open once startup finishes
    keep-alive: true
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/hypeclipper
    username: hype
    password: hype
  sql:
    init:
      mode: always

hype:
  # lowercase twitch login, no leading '#'
  channel: caedrel
  window-seconds: 30
  recent-seconds: 5
  min-messages: 10
  spike-multiplier: 3.0
  dedup-lock-seconds: 60

logging:
  level:
    com.sidduttala.hypeclipper: INFO
