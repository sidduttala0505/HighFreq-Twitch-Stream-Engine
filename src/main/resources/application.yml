spring:
  main:
    web-application-type: none
    # nothing else holds the JVM open once startup finishes
    keep-alive: true
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/hypeclipper
    username: hype
    password: hype
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hype-detector
      # Never replay old chat on restart - a spike from 20 minutes ago is
      # useless, the clip window is long gone.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sidduttala.hypeclipper.model.ChatEvent
        spring.json.trusted.packages: com.sidduttala.hypeclipper.model

hype:
  # lowercase twitch login, no leading '#'
  channel: caedrel
  topic: twitch.chat
  window-seconds: 30
  recent-seconds: 5
  min-messages: 10
  spike-multiplier: 3.0
  dedup-lock-seconds: 60

logging:
  level:
    com.sidduttala.hypeclipper: INFO
